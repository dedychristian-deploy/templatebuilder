$(document).ready(function() {

const array  = [91, 109, 54, 11, 43, 6, 67];

function maxMin(array) {
	
	let max = array[0];
	let min = array[0];

	for (let i = 1; i < array.length; ++i) {
		if (array[i] > max) {
			max = array[i];	
		}
		else if (array[i] < min) {
			min = array[i];
		}
	}

	return {max:max, min:min};

}

	console.log(maxMin(array));

});
