function addList(host, jumlahrosw, newrows){
		const data_a  = [];
		data_a[1] = host.getFieldText("data1");
		data_a[2] = host.getFieldText("data2");
		data_a[3] = host.getFieldText("data3");
		data_a[4] = host.getFieldText("data4");
		data_a[5] = host.getFieldText("data5");
		data_a[6] = host.getFieldText("data6");
		data_a[7] = host.getFieldText("data7");
		data_a[8] = host.getFieldText("data8");

		//Replace (.) with blank
		const num_a  = [];
		num_a[1] = data_a[1].replace(/\./g, '');
		num_a[2] = data_a[2].replace(/\./g, '');
		num_a[3] = data_a[3].replace(/\./g, '');
		num_a[4] = data_a[4].replace(/\./g, '');
		num_a[5] = data_a[5].replace(/\./g, '');
		num_a[6] = data_a[6].replace(/\./g, '');
		num_a[7] = data_a[7].replace(/\./g, '');
		num_a[8] = data_a[8].replace(/\./g, '');


		for (let i = -1; i < jumlahrosw-1; i++) {
		vizrt.payloadhosting.removeListFieldItem("13");
				}
		//hide all row
		for (let i = 1; i < 14; i++) {
			$("#row" + (i)).hide();
			}
		for (let j = 0; j < newrows; j++) {
		vizrt.payloadhosting.addListFieldItem("13",j);
		vizrt.payloadhosting.setFieldText("13/#" + j + "/Y",num_a[j+1]);
		$("#row" + (j+1)).show();
				}
}
