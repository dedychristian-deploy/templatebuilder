    <script>
$(document).ready(function () {
    console.log("Script by: Graphic CNBC INDONESIA-2020");
    var prefix = "(";
    var suffix = ")";
    // Will be called when the field with id "choice" changes
function onKasusPositifChanged(value) {
    p2.setFieldText("02-PENAMBAHAN-KASUS", prefix + value + suffix);
    }
function onKasusSembuhChanged(value) {
    p2.setFieldText("04-PENAMBAHAN-PASIEN-SEMBUH", prefix + value + suffix);
    }
function onKasusMeninggalChanged(value) {
    p2.setFieldText("06-PENAMBAHAN-KASUS-MENINGGAL", prefix + value + suffix);
    }

var p2 = vizrt.payloadhosting;
p2.initialize();
p2.setFieldValueCallbacks({ "01": onKasusPositifChanged });
p2.setFieldValueCallbacks({ "kasus-sembuh": onKasusSembuhChanged });
p2.setFieldValueCallbacks({ "kasus-meninggal": onKasusMeninggalChanged });
});

    </script>
