function timeSettings(value) {
	const bulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
	var today = new Date();
	const d =  new Date();

	var date = today.getDate();

	var months = bulan[d.getMonth()];

	//var months3 = today.setMonth(today.getMonth() - 3);
	//var months3ago = today.toLocaleString('default', { month: 'short' })



	
	
	if (value == "3M"  ) {

		//const d = new Date();
		const month = d.getMonth();
		d.setMonth(d.getMonth() - 3);
		while (d.getMonth() === month) {
			d.setDate(d.getDate() - 3);
		}

		let mth = bulan[d.getMonth()];

		vizrt.payloadhosting.setFieldText("07-time1", date + " " + mth + " " + d.getFullYear());
		vizrt.payloadhosting.setFieldText("07-time2", date + " " + months + " " + today.getFullYear());

		//BACA DATA UPDATE
	} else if (value == "6M") {

		//const d = new Date();
		const month = d.getMonth();
		d.setMonth(d.getMonth() - 6);
		while (d.getMonth() === month) {
			d.setDate(d.getDate() - 6);
		}

		let mth = bulan[d.getMonth()];
		vizrt.payloadhosting.setFieldText("07-time1", date + " " + mth + " " + d.getFullYear());
		vizrt.payloadhosting.setFieldText("07-time2", date + " " + months + " " + today.getFullYear());
	} 

 else if (value == "1Y" ) {

	

		//today.setFullYear(startDate.getFullYear() - 1);

		vizrt.payloadhosting.setFieldText("07-time1", date + " " + months + " " + (d.getFullYear() - 1));
		vizrt.payloadhosting.setFieldText("07-time2", date + " " + months + " " + today.getFullYear());
	}
	else if (value == "YTD" ) {

			

		//today.setFullYear(startDate.getFullYear() - 1);

		vizrt.payloadhosting.setFieldText("07-time1", "01" + " " + "Jan" + " " + today.getFullYear());
		vizrt.payloadhosting.setFieldText("07-time2", date + " " + months + " " + today.getFullYear());
		}

	
}

function formatThousand(numvalue, prefix){
	var number_string = numvalue.replace(/[^,\d]/g, '').toString(),
	split   		= number_string.split(','),
	sisa     		= split[0].length % 3,
	thousand_val     		= split[0].substr(0, sisa),
	thousand     		= split[0].substr(sisa).match(/\d{3}/gi);
 
	// tambahkan titik jika yang di input sudah menjadi numvalue thousand
	if(thousand){
		separator = sisa ? '.' : '';
		thousand_val += separator + thousand.join('.');
	}
	//console.log(split[1]);
	thousand_val = split[1] != undefined ? thousand_val + ',' + split[1]: thousand_val;
	return prefix == undefined ? thousand_val : (thousand_val ? '' + thousand_val : '');
}
