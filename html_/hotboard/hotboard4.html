	const url = "http://10.11.6.68:3000/api/summary-live/";  

function ambilData1(value) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url + value.toUpperCase(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        var data = JSON.parse(xhr.responseText);
        console.log(data);
        vizrt.payloadhosting.setFieldText("01_COMPANY", data.stockname);
        vizrt.payloadhosting.setFieldText("01_PRICE", data.last_price);
        vizrt.payloadhosting.setFieldText("01_POINT", data.net_change);
        vizrt.payloadhosting.setFieldText("01_B_SIGN", data.pct_change);
      }
    };
    xhr.send();
  } catch (err) {}
}
