	<script>

	const url = "http://10.11.6.68:3000/api/summary-live/";  

function ambilData(value) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url + value.toUpperCase(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        var data = JSON.parse(xhr.responseText);
        console.log(data); // cek di console

        // p2.setFieldText("code", data.code_b );
        vizrt.payloadhosting.setFieldText("03_COMPANY", data.stockname);
        vizrt.payloadhosting.setFieldText("03_PRICE", data.last_price);
        vizrt.payloadhosting.setFieldText("03_A_SIGN", data.net_change);
        vizrt.payloadhosting.setFieldText("03_B_SIGN", data.pct_change);
      }
    };
    xhr.send();
  } catch (err) {
    console.log("❌ Error ambilData:", err);
  }
}


	$(document).ready(function () {
		
		console.log("Script by: Graphic CNBC INDONESIA-2020");
		// Will be called when the field with id "code" changes (coming from control text)
		var p2 = vizrt.payloadhosting;
		p2.initialize();
		//p2.setFieldValueCallbacks({ "code1": ambilData1,  "code2": ambilData2});

    $("#field_code1").on('input', function() {
      const value = $(this).val().toUpperCase();

      // Bersihkan tanda "/" di mana pun
      const cleanValue = value.replace(/\//g, '');
      console.log("🎯 User ubah CODE:", cleanValue);

      vizrt.payloadhosting.setFieldText("code1", value);
      ambilData(cleanValue);
    });
    
	});

    </script>
