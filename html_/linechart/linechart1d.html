<head>

    <title>Data Chart</title>	
    <!-- jQuery library -->
    <script src="jquery.min.js"></script>
    <script src="payloadhosting.js"></script>    
	<script src="bootstrap.min.js"></script>
	
	<script>
const url = "http://10.11.6.68:3000/api/summary-live/"; 
const url_chart = "http://10.11.6.68:3000/api/history/";  

function setData(value) {
  var p2 = vizrt.payloadhosting;
  if (!value) return;
  const upper = String(value).toUpperCase();

  // 🔍 Cek cache dulu
  var cache = "";
  try {
    cache = p2.getFieldText("cache");
  } catch (e) {
    console.warn("⚠️ Gagal baca cache:", e);
  }

  // ⚠️ Kalau cache sudah DONE → skip fetch (biasanya habis save)
  if (cache === "DONE") {
    console.log("✅ Cache sudah DONE, skip ambilData & ambilChart");
    return;
  }

  console.log("⏳ Fetch pertama untuk:", upper);

  // Reset cache biar fetch ulang aman
  try { p2.setFieldText("cache", ""); } catch (e) {}

  ambilData(upper);
  ambilChart(upper);
}

// === AMBIL DATA SUMMARY ===
async function ambilData(value) {
  try {
    const res = await fetch(url + value);
    const data = await res.json();
    var p2 = vizrt.payloadhosting;

    p2.setFieldText("00-COMPANY", data.stockname);
    p2.setFieldText("01-PRICE", data.last_price);
    p2.setFieldText("02-CHANGE", data.net_change);
    p2.setFieldText("03-PERCENT", data.pct_change);

  } catch (err) {
    console.error("❌ Error ambilData:", err);
  }
}

// === AMBIL DATA CHART ===
async function ambilChart(value) {
  var p2 = vizrt.payloadhosting;
  var cache = "";

  try {
    cache = p2.getFieldText("cache");
  } catch (e) {}

  if (cache && cache !== "") {
    console.log("⚠️ Skip ambilChart karena cache:", cache);
    return;
  }

  console.log("⏳ Fetch chart untuk:", value);

  try {
    const res = await fetch(url_chart + value);
    const data = await res.json();

    const prices = data.map(d => d.price).join('|');
    p2.setFieldText("04", prices);

    const nums = data.map(d => parseFloat(d.price)).filter(v => !isNaN(v));
    if (!nums.length) return;

    const max = Math.max(...nums);
    const min = Math.min(...nums);

    p2.setFieldText("06-2", max);
    p2.setFieldText("06-1", min);

    // ✅ Setelah sukses, isi cache supaya reload gak refetch
    p2.setFieldText("cache", "DONE");
    console.log("💾 Cache chart diisi DONE");

  } catch (err) {
    console.error("❌ Error ambilChart:", err);
  }
}

$(document).ready(function () {
  console.log("Script by: Graphic CNBC INDONESIA-2020");

  var p2 = vizrt.payloadhosting;
  p2.initialize();

  // Callback jalan tiap kali field CODE berubah
  p2.setFieldValueCallbacks({ "CODE": setData });

  // Debug cache saat load
  try {
    var c = p2.getFieldText("cache");
    console.log("🔁 Cache saat load:", c || "(kosong)");
  } catch (e) {
    console.log("⚠️ Payload belum siap saat read cache");
  }
});
</script>
