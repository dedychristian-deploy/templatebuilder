	<script>
const url = "http://10.11.6.68:3000/api/summary-live/"; 
//const url_chart = "http://10.11.6.68:3000/api/pilotedge/tickagg/";  
const url_chart = "http://10.11.6.68:3000/api/pilotedge/switch/";
//http://10.11.6.68:3000/api/pilotedge/tickagg/.JKSE?limit=200

// === AMBIL DATA SUMMARY ===
function ambilData(value) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url + value, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var p2 = vizrt.payloadhosting;

          p2.setFieldText("00-COMPANY", data.stockname);
          p2.setFieldText("01-PRICE", data.last_price);
          p2.setFieldText("02-CHANGE", data.net_change);
          p2.setFieldText("03-PERCENT", data.pct_change);
        } catch (e) {
          console.log("❌ Gagal parsing JSON:", e);
        }
      }
    };
    xhr.send();
  } catch (err) {
    console.log("❌ Error ambilData:", err);
  }
}

// === AMBIL DATA CHART ===
function ambilChart(value) {
  var p2 = vizrt.payloadhosting;
  console.log("⏳ Fetch chart untuk:", value);

  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url_chart + value, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        try {
          var json = JSON.parse(xhr.responseText);
          var data = json.rows || [];

          if (!data || data.length === 0) {
            console.log("⚠️ Tidak ada data chart untuk " + value);
            return;
          }

          // Gabungkan harga jadi string dipisah '|'
          var pricesArr = [];
          for (var i = 0; i < data.length; i++) {
            pricesArr.push(data[i].price);
          }
          var prices = pricesArr.join('|').replace(/\./g, ',');
          p2.setFieldText("04", prices);

          // Hitung min & max manual (tanpa spread operator)
          var nums = [];
          for (var i = 0; i < data.length; i++) {
            var val = parseFloat(data[i].price);
            if (!isNaN(val)) nums.push(val);
          }

          if (nums.length > 0) {
            var max = nums[0];
            var min = nums[0];
            for (var j = 1; j < nums.length; j++) {
              if (nums[j] > max) max = nums[j];
              if (nums[j] < min) min = nums[j];
            }

            p2.setFieldText("06-2", max);
            p2.setFieldText("06-1", min);
          }
        } catch (parseErr) {
          console.log("❌ Gagal parsing JSON:", parseErr);
        }
      }
    };
    xhr.send();
  } catch (err) {
    console.log("❌ Error ambilChart:", err);
  }
}



$(document).ready(function () {
  console.log("Script by: Graphic CNBC INDONESIA-2020");

  // Callback jalan tiap kali field CODE berubah

 $("#field_CODE").on('input', function() {
  const value = $(this).val().toUpperCase();

  // Buat variabel baru yang bersih dari "/"
  const cleanValue = value.replace(/\//g, '');

  // Update field dengan versi bersih
  //$(this).val(cleanValue);
  console.log("🎯 User ubah CODE:", cleanValue);

  // Kirim ke Vizrt dan fungsi lainnya
  vizrt.payloadhosting.setFieldText("CODE", value);
  ambilData(cleanValue);
  ambilChart(cleanValue);
});


});


</script>
