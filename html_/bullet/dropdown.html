    <script>
$(document).ready(function () {
    console.log("Script by: Graphic CNBC INDONESIA-2021");
// Handle change on the dropdown
$("#ddlselect").on('change', function () {
  
  var d = document.getElementById("ddlselect");
  var displaytext = d.options[d.selectedIndex].text;
  document.getElementById("txtvalue").value=displaytext;
  vizrt.payloadhosting.setFieldText("A1" , displaytext);

});
    // Will be called when the field with id "choice" changes
function onBarChanged(value) {
  //var myField = $("#myfield");
     //myField.text(value);
    //var conceptValue = $(this).data("text");

     if (value == "0") {
    vizrt.payloadhosting.setFieldVisibility("A1", true);
    vizrt.payloadhosting.setFieldVisibility("A2", false);
    vizrt.payloadhosting.setFieldVisibility("A3", false);
  //=====================================================//
    vizrt.payloadhosting.setFieldVisibility("Q1", true);
    vizrt.payloadhosting.setFieldVisibility("Q2", false);
    vizrt.payloadhosting.setFieldVisibility("Q3", false);

    pl.setFieldText("text", "IMMERSIVE_INSTA_1TANYA");

    pl.setFieldText("-vizlayer-IMMERSIVE4", "IMMERSIVE_SMARTPHONE_OPPO1_QUEST_OK");
  } 
  else if (value == "1") {
    vizrt.payloadhosting.setFieldVisibility("A1", true);
    vizrt.payloadhosting.setFieldVisibility("A2", true);
    vizrt.payloadhosting.setFieldVisibility("A3", false);
  //=====================================================//
    vizrt.payloadhosting.setFieldVisibility("Q1", true);
    vizrt.payloadhosting.setFieldVisibility("Q2", true);
    vizrt.payloadhosting.setFieldVisibility("Q3", false);

    pl.setFieldText("text", "IMMERSIVE_INSTA_2TANYA");

    pl.setFieldText("-vizlayer-IMMERSIVE4", "IMMERSIVE_SMARTPHONE_OPPO2_QUEST_OK");
  } 

  else if (value == "2") {
    vizrt.payloadhosting.setFieldVisibility("A1", true);
    vizrt.payloadhosting.setFieldVisibility("A2", true);
    vizrt.payloadhosting.setFieldVisibility("A3", true);
  //=====================================================//
    vizrt.payloadhosting.setFieldVisibility("Q1", true);
    vizrt.payloadhosting.setFieldVisibility("Q2", true);
    vizrt.payloadhosting.setFieldVisibility("Q3", true);

    pl.setFieldText("text", "IMMERSIVE_INSTA_3TANYA");

    pl.setFieldText("-vizlayer-IMMERSIVE4", "IMMERSIVE_SMARTPHONE_OPPO3_QUEST_OK");
  } 
  else {
    vizrt.payloadhosting.setFieldVisibility("A1", true);
    vizrt.payloadhosting.setFieldVisibility("A2", false);
    vizrt.payloadhosting.setFieldVisibility("A3", false);
  //=====================================================//
    vizrt.payloadhosting.setFieldVisibility("Q1", true);
    vizrt.payloadhosting.setFieldVisibility("Q2", false);
    vizrt.payloadhosting.setFieldVisibility("Q3", false);

    pl.setFieldText("-vizlayer-IMMERSIVE4", "IMMERSIVE_SMARTPHONE_OPPO1_QUEST_OK");
}
    }

var pl = vizrt.payloadhosting;
pl.initialize();
pl.setFieldValueCallbacks({ "choice": onBarChanged });
});
