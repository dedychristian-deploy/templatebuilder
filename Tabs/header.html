<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mosart Timing Tabs</title>

  <!-- MOSART TIMING CSS -->
  <link rel="stylesheet" href="mosartTiming.css">

  <!-- TAB OVERRIDE / EXTENSION -->
  <style>
    /* ===== TAB BAR ===== */
    .tab {
      display: flex;
      background-color: #FA9000;
      border-bottom: 1px solid #3d3f42;
    }

    .tab button {
      height: 25px;
      padding: 0 12px;
      background-color: #FA9000;
      color: #ffffff;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 12px;
      font-family: "Open Sans Light", sans-serif;
    }

    .tab button:hover {
      background-color: #00a023;
    }

    .tab button.active {
      background-color: #00a023;
      font-weight: bold;
    }

    /* ===== TAB CONTENT ===== */
    .tabcontent {
      display: none;
      padding: 8px;
      color: #000000;
      font-size: 12px;
    }

    body {
      margin: 0;
      background: #FA9000;
      color: #000000;
      font-family: "Open Sans Light", sans-serif;
    }

  </style>
</head>

<body>

  <!-- TAB BUTTONS -->

   <div style="background:#FA9000;height:100px;line-height:32px;padding:0 10px;font-weight:bold;">
    <img src="aje.png" style="height:100px;margin-right:8px;">
  </div>


</body>
</html>
